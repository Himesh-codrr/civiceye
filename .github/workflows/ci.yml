name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build (demo mode)
        run: VITE_DEMO_MODE=true npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_ROBOFLOW_API_KEY: ${{ secrets.VITE_ROBOFLOW_API_KEY }}
          VITE_ROBOFLOW_WORKSPACE: ${{ secrets.VITE_ROBOFLOW_WORKSPACE }}
          VITE_ROBOFLOW_WORKFLOW_ID: ${{ secrets.VITE_ROBOFLOW_WORKFLOW_ID }}
          VITE_ROBOFLOW_MODEL: ${{ secrets.VITE_ROBOFLOW_MODEL }}
          VITE_ONDEVICE_YOLO_URL: ${{ secrets.VITE_ONDEVICE_YOLO_URL }}
